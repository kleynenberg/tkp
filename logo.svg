<!-- ============================================================================ -->
<!-- INTEGRITY HEADER - GEMINI AI                                                 -->
<!-- File: tkp/logo.svg                                                           -->
<!-- Application: The Kleynenberg Perspective (TKP) — Pure Vector Emblem & Mark   -->
<!-- ============================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120" role="img" aria-labelledby="tkp-logo-title tkp-logo-desc">
  <title id="tkp-logo-title">The Kleynenberg Perspective (TKP)</title>
  <desc id="tkp-logo-desc">Pure vector architectural one-point perspective emblem with acoustic signal bars and geometric TKP monogram for The Kleynenberg Perspective.</desc>

  <!-- Crisp Editorial Background -->
  <rect x="0" y="0" width="380" height="120" fill="#ffffff" />

  <!-- Outer Precision Frame -->
  <rect x="4" y="4" width="372" height="112" fill="none" stroke="#111111" stroke-width="2" />

  <!-- Left Emblem: Architectural One-Point Perspective + Acoustic Pulse -->
  <g transform="translate(16, 16)">
    <rect x="0" y="0" width="88" height="88" fill="#fafafa" stroke="#111111" stroke-width="2" />
    <line x1="0" y1="0" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="88" y1="0" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="0" y1="88" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="88" y1="88" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="0" y1="44" x2="88" y2="44" stroke="#767676" stroke-width="0.9" stroke-dasharray="2 2" />
    <line x1="44" y1="0" x2="44" y2="88" stroke="#767676" stroke-width="0.9" stroke-dasharray="2 2" />
    <rect x="16" y="16" width="56" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
    <rect x="28" y="28" width="32" height="32" fill="#fafafa" stroke="#0056b3" stroke-width="1.75" />
    <circle cx="44" cy="44" r="7" fill="#111111" />
    <circle cx="44" cy="44" r="2.75" fill="#0056b3" />
    <rect x="3" y="3" width="4" height="4" fill="#0056b3" />
    <rect x="81" y="3" width="4" height="4" fill="#111111" />
    <rect x="3" y="81" width="4" height="4" fill="#111111" />
    <rect x="81" y="81" width="4" height="4" fill="#0056b3" />
  </g>

  <!-- Vertical Divider -->
  <line x1="118" y1="16" x2="118" y2="104" stroke="#e0e0e0" stroke-width="1.5" />

  <!-- Right Pure-Vector Lockup (Zero Font Dependencies) -->
  <g transform="translate(134, 18)">
    <!-- Acoustic Signal Bars -->
    <rect x="0" y="3" width="4" height="11" fill="#0056b3" />
    <rect x="7" y="0" width="4" height="14" fill="#111111" />
    <rect x="14" y="5" width="4" height="9" fill="#0056b3" />
    <rect x="21" y="2" width="4" height="12" fill="#111111" />
    <rect x="28" y="6" width="4" height="8" fill="#0056b3" />

    <!-- Top Technical Rule + Eyebrow Vector Glyph -->
    <line x1="40" y1="7" x2="228" y2="7" stroke="#0056b3" stroke-width="2" />
    <rect x="40" y="11" width="46" height="3" fill="#111111" />
    <rect x="92" y="11" width="22" height="3" fill="#0056b3" />

    <!-- Bold Geometric Vector Monogram: T K P (y=24..64) -->
    <!-- Letter T -->
    <path d="M 0 24 H 42 V 32 H 26 V 64 H 16 V 32 H 0 Z" fill="#111111" />
    <!-- Letter K -->
    <path d="M 52 24 H 62 V 41 L 80 24 H 93 L 72 43 L 94 64 H 81 L 62 46 V 64 H 52 Z" fill="#111111" />
    <!-- Letter P (Accent Blue) -->
    <path d="M 103 24 H 130 C 138 24 143 29 143 37 C 143 45 138 50 130 50 H 113 V 64 H 103 Z M 113 32 V 42 H 128 C 131 42 133 40 133 37 C 133 34 131 32 128 32 Z" fill="#0056b3" />

    <!-- Right-side Signal Frequency Matrix beside TKP -->
    <g transform="translate(156, 24)">
      <rect x="0" y="0" width="72" height="4" fill="#111111" />
      <rect x="0" y="9" width="54" height="4" fill="#0056b3" />
      <rect x="60" y="9" width="12" height="4" fill="#111111" />
      <rect x="0" y="18" width="38" height="4" fill="#111111" />
      <rect x="44" y="18" width="28" height="4" fill="#767676" />
      <rect x="0" y="27" width="62" height="4" fill="#0056b3" />
      <rect x="0" y="36" width="72" height="4" fill="#111111" />
    </g>

    <!-- Bottom Colophon Rule & Registration Accent -->
    <line x1="0" y1="74" x2="228" y2="74" stroke="#111111" stroke-width="1.5" />
    <rect x="0" y="79" width="16" height="4" fill="#0056b3" />
    <rect x="20" y="79" width="96" height="4" fill="#111111" />
    <rect x="122" y="79" width="64" height="4" fill="#767676" />
    <rect x="212" y="79" width="16" height="4" fill="#0056b3" />
  </g>
</svg>
