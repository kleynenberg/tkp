<!-- ============================================================================ -->
<!-- INTEGRITY HEADER - GEMINI AI                                                 -->
<!-- File: tkp/logo.svg                                                           -->
<!-- Application: The Kleynenberg Perspective (TKP) — Brand Emblem & Wordmark     -->
<!-- ============================================================================ -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 120" width="380" height="120" role="img" aria-labelledby="tkp-logo-title tkp-logo-desc">
  <title id="tkp-logo-title">The Kleynenberg Perspective (TKP)</title>
  <desc id="tkp-logo-desc">Architectural perspective vanishing-point emblem paired with audio waveform bars and bold geometric typography for The Kleynenberg Perspective.</desc>

  <!-- Crisp Editorial Background -->
  <rect x="0" y="0" width="380" height="120" fill="#ffffff" />

  <!-- Outer Precision Frame -->
  <rect x="4" y="4" width="372" height="112" fill="none" stroke="#111111" stroke-width="2" />

  <!-- Left Emblem: Architectural One-Point Perspective + Acoustic Pulse -->
  <g transform="translate(16, 16)">
    <!-- Outer Perspective Aperture -->
    <rect x="0" y="0" width="88" height="88" fill="#fafafa" stroke="#111111" stroke-width="2" />

    <!-- Perspective Rays converging to focal point (44, 44) -->
    <line x1="0" y1="0" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="88" y1="0" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="0" y1="88" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />
    <line x1="88" y1="88" x2="44" y2="44" stroke="#111111" stroke-width="1.25" />

    <!-- Horizon & Vertical Axis -->
    <line x1="0" y1="44" x2="88" y2="44" stroke="#767676" stroke-width="0.9" stroke-dasharray="2 2" />
    <line x1="44" y1="0" x2="44" y2="88" stroke="#767676" stroke-width="0.9" stroke-dasharray="2 2" />

    <!-- Nested Perspective Depth Planes -->
    <rect x="16" y="16" width="56" height="56" fill="#ffffff" stroke="#111111" stroke-width="1.5" />
    <rect x="28" y="28" width="32" height="32" fill="#fafafa" stroke="#0056b3" stroke-width="1.75" />

    <!-- Central Vanishing Point / Acoustic Lens -->
    <circle cx="44" cy="44" r="7" fill="#111111" />
    <circle cx="44" cy="44" r="2.75" fill="#0056b3" />

    <!-- Corner Registration Marks -->
    <rect x="3" y="3" width="4" height="4" fill="#0056b3" />
    <rect x="81" y="3" width="4" height="4" fill="#111111" />
    <rect x="3" y="81" width="4" height="4" fill="#111111" />
    <rect x="81" y="81" width="4" height="4" fill="#0056b3" />
  </g>

  <!-- Vertical Divider -->
  <line x1="118" y1="16" x2="118" y2="104" stroke="#e0e0e0" stroke-width="1.5" />

  <!-- Right Typographic Lockup -->
  <g transform="translate(132, 0)">
    <!-- Eyebrow Tag + Minimal Signal Bars -->
    <rect x="0" y="22" width="3" height="10" fill="#0056b3" />
    <rect x="5" y="19" width="3" height="13" fill="#111111" />
    <rect x="10" y="24" width="3" height="8" fill="#0056b3" />
    <rect x="15" y="21" width="3" height="11" fill="#111111" />

    <text x="25" y="31" font-family="'Atkinson Hyperlegible Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1.6" fill="#0056b3">TKP // PODCAST &amp; ESSAYS</text>

    <!-- Primary Title Stack -->
    <text x="0" y="54" font-family="'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2.2" fill="#4a4a4a">THE</text>
    <text x="0" y="75" font-family="'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.4" fill="#111111">KLEYNENBERG</text>
    <text x="0" y="95" font-family="'Atkinson Hyperlegible Next', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19.5" font-weight="700" letter-spacing="0.8" fill="#111111">PERSPECTIVE</text>

    <!-- Bottom Colophon Rule & Domain Stamp -->
    <line x1="0" y1="103" x2="232" y2="103" stroke="#111111" stroke-width="1.25" />
    <text x="232" y="111.5" text-anchor="end" font-family="'Atkinson Hyperlegible Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="7.5" font-weight="700" letter-spacing="1" fill="#767676">TKP.KLEYNENBERG.COM</text>
  </g>
</svg>
